# Local Postgres with the pgvector extension, for Phase 4 onwards.
#   docker compose up -d      start it (data survives restarts in the named volume)
#   docker compose down -v    stop it and delete the data
# Host port 5433, so it doesn't clash with a Postgres already running on 5432.
# The credentials are for local development only; production gets its URL from the env.
services:
  db:
    image: pgvector/pgvector:0.8.7-pg17  # pinned, like uv.lock: pgvector 0.8.7, Postgres 17
    environment:
      POSTGRES_USER: about_rag
      POSTGRES_PASSWORD: about_rag
      POSTGRES_DB: about_rag
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U about_rag -d about_rag"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
