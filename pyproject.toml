[project]
name = "about-me"
version = "0.1.0"
description = "A RAG assistant that answers questions about Saeem Mehmood Sadiq"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.9.0",
    "google-genai>=2.31.0",
    "numpy>=2.5.4",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.3",
    "pypdf>=6.20.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.6",
]
tools = [
    "markdown>=3.11.1",
    "xhtml2pdf>=0.2.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/about_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, B: bugbear,
# UP: modern Python syntax, SIM: simplifications
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# llm tests call the real Gemini API (needs a key, uses free-tier quota, answers vary),
# so they are opt-in: uv run pytest -m llm
addopts = "-m 'not llm'"
markers = [
    "model: runs the real embedding model (downloads it on first run)",
    "db: needs Postgres from docker-compose.yml (skipped locally when it is not running)",
    "llm: calls the real Gemini API; deselected by default",
]
