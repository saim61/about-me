[project]
name = "about-me"
version = "0.1.0"
description = "A RAG assistant that answers questions about Saeem Mehmood Sadiq"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.3",
    "pypdf>=6.20.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
tools = [
    "markdown>=3.11.1",
    "xhtml2pdf>=0.2.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/about_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, B: bugbear,
# UP: modern Python syntax, SIM: simplifications
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
