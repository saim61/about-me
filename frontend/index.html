<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask about Saeem</title>
  <meta name="description" content="A small RAG assistant that answers questions about Saeem Mehmood Sadiq.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Ask about Saeem</h1>
        <p>A small RAG assistant that answers questions about Saeem Mehmood Sadiq's work, projects, and background.</p>
      </div>
      <nav><a href="how-it-works.html">How it works →</a></nav>
    </header>

    <section id="chat" aria-live="polite">
      <div id="starters" class="chips">
        <button type="button">Who is Saeem?</button>
        <button type="button">How did he cut RAM from 2 GB to 40 MB?</button>
        <button type="button">Tell me about his projects</button>
        <button type="button">What does he do for fun?</button>
        <button type="button">Saeem ne kahan parhai ki?</button>
      </div>
    </section>

    <form id="ask">
      <input id="question" name="question" autocomplete="off" maxlength="500"
             placeholder="Ask a question about Saeem…" aria-label="Your question" required>
      <button type="submit">Ask</button>
    </form>

    <footer>
      Answers come only from what Saeem has shared publicly. Questions are processed by Google Gemini.
      · <a href="https://github.com/saim61/about-me">Source</a>
    </footer>
  </main>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("ask");
    const input = document.getElementById("question");
    const button = form.querySelector("button");
    const history = [];
    const asked = new Set();

    const FOLLOW_UPS = [
      [/Hobbies/, ["What is Saeem learning right now?", "Where is Saeem based?"]],
      [/Technical Skills/, ["Does Saeem know Kubernetes?", "Which databases has he used?"]],
      [/Code Graphers/, ["How did he cut RAM from 2 GB to 40 MB?", "Where did he work before Code Graphers?"]],
      [/Dycoders/, ["What did he do at Automatiq?", "Does Saeem know Elixir?"]],
      [/Automatiq/, ["What did he do at InvoZone?", "What was his first job?"]],
      [/InvoZone/, ["What was his first job?", "Does Saeem know Elixir?"]],
      [/Timeline|ILI Digital/, ["What does he do at ILI Digital?", "How many years of experience does he have?"]],
      [/Projects|Hookline|Podium|fxflow|Olist|Message App|imagehash/,
        ["What is Hookline?", "Tell me about Podium", "What open-source contribution has he made?"]],
      [/Education|Levels|Background/, ["Which university did he attend?", "Where did he do his A Levels?"]],
      [/Learning/, ["Has he built any data engineering projects?", "What is fxflow?"]],
      [/Contact|Quick Facts/, ["What is Saeem's GitHub?", "Tell me about his projects"]],
      [/Summary/, ["What are his skills?", "Tell me about his projects"]],
    ];
    const DEFAULT_FOLLOW_UPS = ["Who is Saeem?", "Tell me about his projects", "What does he do for fun?"];

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    }

    function inline(text) {
      return escapeHtml(text)
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/(https?:\/\/[^\s<)]*[^\s<).,!?;:])/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    }

    function render(markdown) {
      const html = [];
      let list = false;
      for (const line of markdown.split("\n")) {
        const item = line.match(/^\s*[-*]\s+(.*)/);
        if (item) {
          if (!list) { html.push("<ul>"); list = true; }
          html.push(`<li>${inline(item[1])}</li>`);
          continue;
        }
        if (list) { html.push("</ul>"); list = false; }
        if (line.trim()) html.push(`<p>${inline(line)}</p>`);
      }
      if (list) html.push("</ul>");
      return html.join("");
    }

    function bubble(role, text = "") {
      const el = document.createElement("div");
      el.className = `msg ${role}`;
      el.innerHTML = render(text);
      chat.appendChild(el);
      el.scrollIntoView({ behavior: "smooth", block: "end" });
      return el;
    }

    function underTheHood(sources, guardrail) {
      const details = document.createElement("details");
      details.className = "under";
      if (guardrail) {
        details.innerHTML = `<summary>🔍 How I answered this</summary>
          <p class="query">A cheap pre-check answered this before any LLM call
          (<code>${escapeHtml(guardrail)}</code>), so no Gemini quota was used.</p>`;
        return details;
      }
      const items = sources.chunks.map((c) => `<li>${escapeHtml(c.section || "untitled")}
        <div class="bar" title="similarity ${c.score}"><span style="width:${Math.max(0, c.score) * 100}%"></span></div>
        </li>`).join("");
      details.innerHTML = `<summary>🔍 How I found this</summary>
        <p class="query">Searched for: <q>${escapeHtml(sources.search_query)}</q></p>
        <ol>${items}</ol>`;
      return details;
    }

    function followUps(sections) {
      const picked = [];
      for (const section of sections) {
        for (const [pattern, questions] of FOLLOW_UPS) {
          if (pattern.test(section)) picked.push(...questions);
        }
      }
      const fresh = [...new Set([...picked, ...DEFAULT_FOLLOW_UPS])]
        .filter((q) => !asked.has(q.toLowerCase()))
        .slice(0, 3);
      if (!fresh.length) return null;
      const box = document.createElement("div");
      box.className = "chips follow-ups";
      for (const q of fresh) {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.textContent = q;
        box.appendChild(chip);
      }
      return box;
    }

    async function ask(question) {
      document.querySelectorAll("#chat .chips").forEach((el) => el.remove());
      asked.add(question.toLowerCase());
      bubble("user", question);
      const reply = bubble("bot");
      reply.classList.add("typing");
      button.disabled = true;
      let answer = "";
      let sources = null;
      let guardrail = null;

      try {
        const response = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, history: history.slice(-3) }),
        });
        if (!response.ok) {
          const body = await response.json().catch(() => ({}));
          throw new Error(typeof body.detail === "string" ? body.detail : "Something went wrong. Please try again.");
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop();
          for (const line of lines) {
            if (!line.trim()) continue;
            const event = JSON.parse(line);
            if (event.type === "sources") {
              sources = event;
            } else if (event.type === "text") {
              answer += event.text;
              reply.innerHTML = render(answer);
              reply.scrollIntoView({ block: "end" });
            } else if (event.type === "done") {
              guardrail = event.guardrail || null;
            } else if (event.type === "error") {
              throw new Error(event.message);
            }
          }
        }
        history.push({ question, answer });
        if (sources || guardrail) reply.appendChild(underTheHood(sources, guardrail));
        const chips = followUps(sources ? sources.chunks.map((c) => c.section || "") : []);
        if (chips) chat.appendChild(chips);
      } catch (error) {
        reply.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`;
      } finally {
        reply.classList.remove("typing");
        button.disabled = false;
        input.focus();
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const question = input.value.trim();
      if (!question || button.disabled) return;
      input.value = "";
      ask(question);
    });

    chat.addEventListener("click", (event) => {
      const target = event.target;
      if (target.tagName === "BUTTON" && target.closest(".chips") && !button.disabled) {
        ask(target.textContent);
      }
    });
  </script>
</body>
</html>
