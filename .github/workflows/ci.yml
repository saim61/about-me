name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      # Same image and host port as docker-compose.yml, so the default database_url works.
      db:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: about_rag
          POSTGRES_PASSWORD: about_rag
          POSTGRES_DB: about_rag
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U about_rag -d about_rag"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest